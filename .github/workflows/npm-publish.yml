name: npm

# Runs off the tag rather than the Release workflow: a release created with the
# default GITHUB_TOKEN does not fire release events, so this workflow builds its
# own binaries and stays independent of release.yml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: darwin-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @opentui/core imports @opentui/core-<platform>-<arch> at build time, so
      # each target has to be compiled on its own runner.
      - name: Set app version from tag
        shell: bash
        run: bun script/set-version.js

      - name: Compile binary
        shell: bash
        run: |
          mkdir -p dist/package
          bun build source/cli.js \
            --compile \
            --bytecode \
            --format=esm \
            --target=bun-${{ matrix.target }} \
            --minify \
            --outfile dist/package/openinsight

          chmod +x dist/package/openinsight

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --strict --verbose=2 dist/package/openinsight

      - name: Smoke test binary
        shell: bash
        run: ./dist/package/openinsight --help

      - name: Package binary
        shell: bash
        run: |
          tar -C dist/package -czf dist/openinsight-${{ matrix.target }}.tar.gz openinsight

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: npm-openinsight-${{ matrix.target }}.tar.gz
          path: dist/openinsight-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: npm-openinsight-*
          merge-multiple: true

      - name: Publish packages
        run: bun script/publish-npm.js
