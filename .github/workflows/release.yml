name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: darwin-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set app version from tag
        shell: bash
        run: bun script/set-version.js

      - name: Compile binary
        shell: bash
        run: |
          mkdir -p dist/package
          bun build source/cli.js \
            --compile \
            --bytecode \
            --format=esm \
            --target=bun-${{ matrix.target }} \
            --minify \
            --outfile dist/package/openinsight

          chmod +x dist/package/openinsight

      - name: Smoke test binary
        shell: bash
        run: ./dist/package/openinsight --help

      - name: Smoke test web mode
        shell: bash
        run: |
          ./dist/package/openinsight --web --port 5679 > web-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:5679/api/status >/tmp/openinsight-status.json; then
              break
            fi
            sleep 0.1
          done

          curl -fsS http://127.0.0.1:5679/ >/tmp/openinsight-index.html
          curl -fsS http://127.0.0.1:5679/app.js >/tmp/openinsight-app.js
          curl -fsS http://127.0.0.1:5679/styles.css >/tmp/openinsight-styles.css
          grep -q "OpenInsight" /tmp/openinsight-app.js
          grep -q "prefers-color-scheme" /tmp/openinsight-styles.css

      - name: Package binary
        shell: bash
        run: |
          tar -C dist/package -czf dist/openinsight-${{ matrix.target }}.tar.gz openinsight

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: openinsight-${{ matrix.target }}.tar.gz
          path: dist/openinsight-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/openinsight-*.tar.gz

  homebrew:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish Homebrew formula
        run: bun script/publish-homebrew.js
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
